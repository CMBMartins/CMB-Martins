<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Despesas</title>
    <link rel="stylesheet" href="DashboardGestãodeDespesas.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
}

.layout {
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background: #1e293b;
    padding: 20px;
    height: 100vh;
}

.sidebar h2 {
    margin-bottom: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5f5;
    text-decoration: none;
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
}

.sidebar a:hover {
    background: #334155;
}

#usuariologado {
        text-align: right;
        float: right;
        padding: 6px 10px;
        text-align: right;
        font-weight: bold;
        font-size: 14px;
        color: #003366;
        background: #e6f2ff;
        border: 2px solid #007bff;
        border-radius: 6px;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
    }
/* LOGIN */
.login {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid #ddd;
}

.login-botoes {
    margin-top: 10px;
    display: flex;
    gap: 10px;
}

.login button {
    flex: 1;
    padding: 8px;
    border: none;
    background: #4e73df;
    color: white;
    border-radius: 5px;
}

/* CONTEÚDO */
.conteudo {
    flex: 1;
    padding: 20px;
}

/* TOPO */
.topo {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.card {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    padding: 20px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* GRÁFICOS */
.graficos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

.grafico {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

/* TABELA */
.tabela {
    margin-top: 20px;
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #334155;
}

/* RESPONSIVO */
@media (max-width: 900px) {
    .cards {
        grid-template-columns: 1fr 1fr;
    }

    .graficos {
        grid-template-columns: 1fr;
    }
}
</style>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>💰 Financeiro</h2>

        <nav>
            <a href="#">📊 Dashboard</a>
            <a href="GestãodeDespesas.html">➕ Cadastro de Despesas</a>
            <a href="#">📄 Relatórios</a>
        </nav>
    </aside>

    <!-- CONTEÚDO -->
    <main class="conteudo">

        <!-- TOPO -->
        <header class="topo">
            <h1>Relatórios</h1>

             <div class="usuario">
                <input type="text" id="usuariologado" placeholder="Usuário" readonly>
            </div>           
           
        </header>

        <!-- CARDS -->
        <section class="cards">

            <div class="card">
                <h3>Total</h3>
                <p id="total">R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Este Mês</h3>
                <p id="mes">R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Pagas</h3>
                <p id="pagas">0</p>
            </div>

            <div class="card">
                <h3>Pendentes</h3>
                <p id="pendentes">0</p>
            </div>

        </section>
        
            <section class="graficos">

            <div class="grafico">
                <h3>Por Categoria</h3>
                <canvas id="graficoCategoria"></canvas>
            </div>

            <div class="grafico">
                <h3>Por Mês</h3>
                <canvas id="graficoMes"></canvas>
            </div>

        </section>

        <!-- TABELA -->
        <section class="tabela">

            <h3>Últimas Despesas</h3>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="ultimasDespesas"></tbody>
            </table>

        </section>

    </main>

</div>

  
<script>

const API = "http://localhost:8084/despesas";

// 🚀 CARREGAMENTO INICIAL
window.onload = function () {
    carregarDashboard();
    listarTodos();
    carregarGraficoMensal();
    gerarGraficoStatus();
};

// 🔥 DASHBOARD COMPLETO (usa endpoints específicos)
function carregarDashboard() {

    // TOTAL
    fetch(API + "/total")
        .then(res => res.json())
        .then(total => {
            document.getElementById("total").innerText = "R$ " + total.toFixed(2);
        });

     // STATUS
    fetch(API + "/status")
    .then(res => res.json())
    .then(data => {

        const pagas = data.PAGA || data.Paga || data.paga || 0;
        const pendentes = data.PENDENTE || data.Pendente || data.pendente || 0;

        document.getElementById("pagas").innerText = pagas;
        document.getElementById("pendentes").innerText = pendentes;

        console.log("Status:", data); // 🔥 debug

    })
    .catch(err => console.error("Erro status:", err));

    // GRÁFICO
    fetch(API + "/categoria")
        .then(res => res.json())
        .then(data => {

            new Chart(document.getElementById("graficoCategoria"), {
                type: "pie",
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        data: Object.values(data)
                    }]
                }
            });

        });

    // ÚLTIMAS DESPESAS
    fetch(API + "/ultimas")
        .then(res => res.json())
        .then(lista => {

            let tabela = document.getElementById("ultimasDespesas");
            tabela.innerHTML = ""; // 🔥 limpa antes

            lista.forEach(d => {
                tabela.innerHTML += `
                    <tr>
                        <td>${d.data}</td>
                        <td>${d.descricao}</td>
                        <td>R$ ${d.valor ?? 0}</td>
                    </tr>
                `;
            });

        });
}

function gerarGraficoStatus() {

    fetch(API + "/status")
        .then(res => res.json())
        .then(data => {

            const pagas = data.PAGA || data.Paga || 0;
            const pendentes = data.PENDENTE || data.Pendente || 0;

            const ctx = document.getElementById("graficoStatus");

            new Chart(ctx, {
                type: "doughnut",
                data: {
                    labels: ["Pagas", "Pendentes"],
                    datasets: [{
                        data: [pagas, pendentes]
                    }]
                }
            });

        })
        .catch(error => console.error("Erro gráfico status:", error));
}

function carregarGraficoMensal() {

    fetch(API + "/mensal")
        .then(res => res.json())
        .then(data => {

            const mesesNomes = [
                "Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                "Jul", "Ago", "Set", "Out", "Nov", "Dez"
            ];

            // ordenar meses corretamente
            const meses = Object.keys(data)
                .map(m => parseInt(m))
                .sort((a, b) => a - b);

            const labels = meses.map(m => mesesNomes[m - 1]);
            const valores = meses.map(m => data[m]);

            // 🔥 ATUALIZA CARD "ESTE MÊS"
            const mesAtual = new Date().getMonth() + 1;
            const valorMes = data[mesAtual] || 0;

            document.getElementById("mes").innerText =
                "R$ " + valorMes.toFixed(2);

            // 🔥 GRÁFICO
            const ctx = document.getElementById("graficoMes");

            if (window.graficoMes && typeof window.graficoMes.destroy === "function") {
             window.graficoMes.destroy();
             }

            window.graficoMes = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Gastos por mês",
                        data: valores
                    }]
                }
            });

        })
        .catch(err => console.error("Erro mensal:", err));
}

// 📋 LISTAR TODAS DESPESAS
function listarTodos() {

    fetch(API)
        .then(response => response.json())
        .then(data => {

            const tabela = document.getElementById("ultimasDespesas");
            tabela.innerHTML = "";

            data.forEach(d => {

                tabela.innerHTML += `
<tr>
<td>${d.data}</td>
<td>${d.descricao}</td>
<td>R$ ${d.valor ?? 0}</td>
<td>${d.status}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="deletar(${d.id})">
Excluir
</button>
</td>
</tr>
`;

            });

        })
        .catch(error => console.error("Erro:", error));
}


         // FUNÇÃO PARA AUTENTICAR O USUARIO NO BANCO E MOSTRAR NA TELA
        function login() {

            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;

            // Validação de campos vazios
            if (usuario === "" && senha === "") {
                alert("⚠️ Informe usuario e senha para realizar Login!");
                return;
            }

            if (usuario === "") {
                alert("⚠️ Informe o usuário!");
                return;
            }

            if (senha === "") {
                alert("⚠️ Informe a senha!");
                return;
            }

            fetch("http://localhost:8084/usuario", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuario,
                    senha
                })

            })

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Login inválido");
                    }

                    return response.json();

                })

                .then(data => {

                    // Mostra o usuário no campo Default

                    document.getElementById("usuariologado").value = data.usuario;
                    alert("Login realizado com sucesso!");
                    liberarFuncoes();
                    limparLogin();

                })


                .catch(error => {

                    alert("Usuário ou senha incorretos");

                });

        }


        // FUNÇÃO EFETUAR O LOGOUT
        function logout() {

            localStorage.removeItem("usuariologado");

            document.getElementById("usuariologado").value = "";

            bloquearFuncoes();

        }


        // FUNÇÃO PARA LIMPAR OS CAMPOS DO LOGIN
        function limparLogin() {
            document.getElementById("usuario").value = "";
            document.getElementById("senha").value = "";

        }       
        
</script>

</body>
</html>
